name: Checks
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Linux integration checks
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        with:
          version: 0.21.11
          verb: call
          module: ./ci/dagger/check
          args: checks --source .
      - name: Record Dagger check receipt
        if: github.event_name == 'pull_request'
        run: python3 scripts/release_acceptance.py create-check --root "$GITHUB_WORKSPACE"
      - name: Upload Dagger check receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jellyfin-check-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: check-candidate.json
          if-no-files-found: error
          retention-days: 90
