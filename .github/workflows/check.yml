name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv python install
      - run: python scripts/prepare.py
      - run: uv sync --locked --all-groups
      - run: uv run --locked python scripts/check.py
      - name: Verify locked sync did not modify the lockfile
        run: git diff --exit-code -- uv.lock
