name: Nemotron macOS audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-audit:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile Nemotron's native AppKit probes
        run: |
          mkdir -p outputs
          xcrun swiftc work/NativeMenus.swift work/NativeSettings.swift work/NativeMedia.swift tests/native/NemotronMacAudit.swift -o /tmp/nemotron-mac-audit -framework AppKit -framework MediaPlayer
      - name: Execute native audit and collect individual results
        run: |
          python3 -c 'import subprocess; subprocess.run(["/tmp/nemotron-mac-audit", "outputs/nemotron-mac-audit.json"], check=True, timeout=120)'
      - name: Upload native audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemotron-macOS-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/nemotron-mac-audit.json
          if-no-files-found: warn
