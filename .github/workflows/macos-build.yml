name: macOS build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build prerequisites
        run: brew install python@3.13 mpv
      - run: /opt/homebrew/bin/python3.13 scripts/prepare.py
      - run: /opt/homebrew/bin/python3.13 -m venv work/build-env
      - run: work/build-env/bin/python -m pip install -r requirements-build.txt
      - run: work/build-env/bin/python -m pip install --no-deps ./work/source
      - run: work/build-env/bin/python scripts/check.py
      - run: work/build-env/bin/python work/build.py
      - run: work/build-env/bin/python work/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-MPV-Shim-macOS-Apple-Silicon-development
          path: outputs/*.dmg
          if-no-files-found: error
