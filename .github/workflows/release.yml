name: Prepare macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'iarnvidr/jellyfin-mpv-shim-macos' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref }}
      - name: Verify immutable version identity
        run: uvx --from 'uv==0.13.1' python scripts/release.py validate-tag '${{ github.ref_name }}'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          enable-cache: true
      - run: test "$(uname -m)" = arm64
      - run: uv python install
      - run: uv run --locked --no-sync python scripts/prepare.py
      - run: uv sync --locked --all-groups
      - run: git diff --exit-code -- uv.lock
      - run: uv run --locked python scripts/check.py
      - run: brew install mpv
      - run: uv run --locked python work/build.py
      - run: uv run --locked python work/package.py
      - name: Record checksums
        run: shasum -a 256 outputs/*.dmg > outputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-candidate-${{ github.ref_name }}
          path: outputs/*
          if-no-files-found: error
  draft:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-candidate-${{ github.ref_name }}
          path: artifacts
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validate tag and refuse replacement
        run: |
          python3 scripts/release.py validate-tag '${{ github.ref_name }}'
          gh release view '${{ github.ref_name }}' >/dev/null 2>&1 && { echo 'release already exists; refusing overwrite'; exit 1; } || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create draft with immutable candidate artifacts
        run: gh release create '${{ github.ref_name }}' artifacts/* --draft --verify-tag --title '${{ github.ref_name }}' --notes 'Automated macOS Apple Silicon candidate. Draft only; production publication requires every qualification gate.'
        env:
          GH_TOKEN: ${{ github.token }}
      # Production publication is deliberately a distinct trusted dispatch. This
      # job only creates a draft; never expose signing/feed credentials here.
