name: Prepare macOS release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main macOS build run to publish without rebuilding
        required: true
        type: string
      preview_tag:
        description: Version tag matching VERSION (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  preview-publish:
    if: github.repository == 'iarnvidr/jellyfin-mpv-shim-macos' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: preview-release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
      TRUSTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install
      - name: Validate trusted build and artifact identity
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          uv run --locked --no-sync python scripts/release.py validate-tag "$PREVIEW_TAG"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          uv run --locked --no-sync python scripts/release.py validate-run run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > artifacts.json
          uv run --locked --no-sync python - <<'PY' > artifact-id.txt
          import json, sys
          sys.path.insert(0, 'scripts')
          import release
          run = json.load(open('run.json'))
          name = f"Jellyfin-Player-macOS-Apple-Silicon-{run['id']}-{run['run_attempt']}"
          print(release.find_run_artifact(json.load(open('artifacts.json')), name))
          PY
      - name: Download and verify exact tested packages
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$(cat artifact-id.txt)/zip" > artifact.zip
          mkdir artifacts
          unzip -q artifact.zip -d artifacts
          uv run --locked --no-sync python scripts/release.py verify-artifacts artifacts --metadata "$PREVIEW_TAG" > verified.json
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
      - name: Install verified Sparkle signer
        run: |
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o /tmp/sparkle.tar.xz
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  /tmp/sparkle.tar.xz' | shasum -a 256 -c -
          mkdir /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
      - name: Sign exact update archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ARCHIVE="artifacts/Jellyfin-Player-$(cat VERSION)-Apple-Silicon.zip"
          uv run --locked --no-sync python scripts/release.py sign "$ARCHIVE" --sign-update /tmp/sparkle/bin/sign_update > signature.json
          uv run --locked --no-sync python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          import release
          release.write_signature_assets('artifacts', json.load(open('signature.json')), json.load(open('verified.json'))['archive'])
          PY
          uv run --locked --no-sync python scripts/release.py verify-artifacts artifacts --metadata "$PREVIEW_TAG"
      - name: Create immutable tag and draft preview
        run: |
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement'
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${PREVIEW_TAG}" > tag.json 2>/dev/null; then
            test "$(uv run --locked --no-sync python -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = "$TRUSTED_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${PREVIEW_TAG}" -f "sha=${TRUSTED_SHA}"
          fi
          gh release create "$PREVIEW_TAG" artifacts/* --draft --prerelease --verify-tag --title "Jellyfin Player $(cat VERSION)" --notes 'Apple Silicon macOS preview. Update signature and checksums included. Not Apple notarized.'
