name: Bad menu state automatic update retirement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download isolated server fixture
        run: |
          curl --fail --location --retry 3 https://repo.jellyfin.org/files/server/macos/stable/v12.3/arm64/jellyfin_12.3-arm64.dmg --output "$RUNNER_TEMP/jellyfin.dmg"
          hdiutil attach "$RUNNER_TEMP/jellyfin.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/jellyfin-volume"
          mkdir server
          ditto "$RUNNER_TEMP/jellyfin-volume/Jellyfin.app" server/Jellyfin.app
          hdiutil detach "$RUNNER_TEMP/jellyfin-volume"
      - name: Prove bad menu state then automatically update public 0.2.9 to public 0.2.11
        run: python3 scripts/prove_bad_menu_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bad-menu-state-update
          path: |
            outputs/bad-menu-update/*.json
            outputs/bad-menu-update/*.jsonl
            outputs/bad-menu-update/*.log
            outputs/bad-menu-update/*.png
            outputs/bad-menu-update/observer.m
