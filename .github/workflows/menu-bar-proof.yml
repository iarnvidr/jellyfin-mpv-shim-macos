name: Effective menu preference diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download exact published 0.2.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download v0.2.10 --repo iarnvidr/jellyfin-mpv-shim-macos --pattern Jellyfin-Player-0.2.10-Apple-Silicon.zip --pattern SHA256SUMS --dir release
          cd release
          awk '$2 == "Jellyfin-Player-0.2.10-Apple-Silicon.zip"' SHA256SUMS > zip-checksum
          test -s zip-checksum
          shasum -a 256 --check zip-checksum
          ditto -x -k Jellyfin-Player-0.2.10-Apple-Silicon.zip .
      - name: Discover installed settings and prove effective Finder control before browser comparison
        run: python3 scripts/prove_effective_menu_preference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effective-menu-preference-${{ matrix.os }}
          path: outputs/effective-menu-preference
