name: Menu bar candidate cross SDK package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ae673faeb8c9ce58d037382a87376594af301ca
          submodules: recursive
      - name: Record exact candidate and cross SDK build environment
        run: |
          test "$(git rev-parse HEAD)" = 8ae673faeb8c9ce58d037382a87376594af301ca
          test "$(uname -m)" = arm64
          mkdir -p outputs
          git rev-parse HEAD > outputs/candidate-source-commit.txt
          sw_vers > outputs/candidate-host.txt
          xcodebuild -version > outputs/candidate-xcode.txt
          xcrun --show-sdk-version > outputs/candidate-sdk.txt
          echo "$MACOSX_DEPLOYMENT_TARGET" > outputs/candidate-deployment-target.txt
      - name: Verify native menu actions and keyboard equivalents
        run: |
          xcrun swiftc work/NativeMenus.swift work/NativeSettings.swift work/NativeMedia.swift tests/native/VerifyNativeMenus.swift -o /tmp/verify-native-menus -framework AppKit -framework MediaPlayer
          /tmp/verify-native-menus
          xcrun clang -fobjc-arc tests/native/VerifyNativeControls.m -o /tmp/verify-native-controls -framework Cocoa -framework MediaPlayer
          /tmp/verify-native-controls
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Prepare resources
        run: uv run --locked --no-sync python scripts/prepare.py
      - name: Install locked build environment
        run: uv sync --locked --all-groups
      - name: Verify lock unchanged
        run: git diff --exit-code -- uv.lock
      - name: Integration checks
        run: uv run --locked python scripts/check.py
      - name: Build app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: uv run --locked python work/build.py
      - name: Package and verify
        run: |
          work/mpv-release/mpv.app/Contents/MacOS/mpv --no-config --idle=yes --vo=null --ao=null --script=tests/native/VerifyNativeControls.lua
          uv run --locked python work/package.py
      - name: Verify extracted DMG and update ZIP with native windows and playback
        run: uv run --locked python scripts/distribution_check.py
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-Player-macOS-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/macos-smoke-evidence/**
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jellyfin-Player-macOS-Apple-Silicon-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/*.dmg
            outputs/*-Apple-Silicon.zip
            outputs/*-Source.zip
            outputs/*-Build-Manifest.json
            outputs/*-Native-Audit.json
            outputs/*-Bundle-Inventory.json
            outputs/*-Signatures.json
            outputs/SHA256SUMS
            outputs/candidate-*.txt
          if-no-files-found: error
          compression-level: 0
